name: Aktionen-Feed

on:
  schedule:
    # Dienstag 04:00 UTC = 06:00 Sommerzeit / 05:00 Winterzeit in der Schweiz.
    - cron: "0 4 * * 2"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Aktionen sammeln
        run: python -m feed.build
      - name: Ergebnis im Repository ablegen
        run: |
          git config user.name "aktionen-feed[bot]"
          git config user.email "aktionen-feed@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Feed $(date -u +%Y-%m-%d) aktualisiert"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
